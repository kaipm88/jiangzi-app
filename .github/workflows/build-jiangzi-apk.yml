name: Build JiangZi Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'hanzi_web/**'
      - 'android_jiangzi/**'
      - '.github/workflows/build-jiangzi-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Sync latest hanzi_web into Android assets
        run: |
          rm -rf android_jiangzi/app/src/main/assets/www
          mkdir -p android_jiangzi/app/src/main/assets/www
          cp -R hanzi_web/* android_jiangzi/app/src/main/assets/www/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Ready-to-Install Release APK
        working-directory: android_jiangzi
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../JiangZi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiangZi-Android-APK
          path: JiangZi.apk

      - name: Publish Direct Download Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.3.0 >/dev/null 2>&1; then
            gh release upload v2.3.0 JiangZi.apk --clobber
          else
            gh release create v2.3.0 JiangZi.apk --title "JiangZi v2.3.0 Pro Core (Chấm Phát Âm Micro + Ghép Câu + Văn Phòng Tứ Bảo + Thẻ Ấn Triện)" --notes "Bản nâng cấp Nấc 1 Thương Mại (v2.3.0): Chấm phát âm tiếng Trung qua Micro thật, Lắp ghép câu & Mẹo ngữ pháp 10s, Tiệm Văn Phòng Tứ Bảo đổi Ngọc Hộ Mệnh giữ Streak & 4 Màu Mực Quý, Xuất Thẻ Ấn Triện Thủy Mặc chia sẻ thành tích."
          fi
